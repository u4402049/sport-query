    <title>線上測驗系統</title>

    <style>
        body { font-family: sans-serif; }
        .correct-ans { background-color: #d1fae5 !important; border-color: #10b981 !important; font-weight: bold; color: #065f46; }
        .wrong-ans { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c; }

    </style>
</head>
<body class="text-gray-800 antialiased bg-white">

    <div class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b py-3 mb-6 flex flex-row justify-between items-center gap-2">
        <div class="text-base md:text-xl font-bold text-blue-700 bg-blue-50 px-3 py-1.5 rounded-lg whitespace-nowrap shadow-sm">
            總分：<span id="total-score-display" class="text-lg md:text-2xl text-red-600">0</span> / 100
        </div>
        <select id="stage-select" onchange="jumpToStage(this.value)" class="flex-1 min-w-0 max-w-[60%] md:max-w-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm md:text-lg rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 font-semibold shadow-sm cursor-pointer truncate">
            <!-- 選項將由 JavaScript 產生 -->
        </select>
    </div>

    <!-- 測驗內容區塊 -->
    <div id="quiz-container">
        <!-- 題目將由 JavaScript 渲染產生 -->
    </div>

    <!-- 底部按鈕 -->
    <div class="mt-8 border-t pt-6 flex justify-end gap-4">
        <button id="submit-btn" onclick="checkAnswers()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-lg shadow transition-colors text-xl">
            送出訂正

            下一階段

    </div>

</div>

// 解析資料
const data = quizDataString.trim().split('\n').map(line => {
    const parts = line.split('|');
    return {
        id: parseInt(parts[0]),
        ans: parts[1],
        q: parts[2],
        options: [
            { value: 'A', text: parts[3] },
            { value: 'B', text: parts[4] },
            { value: 'C', text: parts[5] },
            { value: 'D', text: parts[6] }
        ]
    };
});

let currentPage = 0;
const questionsPerPage = 10;
const totalPages = Math.ceil(data.length / questionsPerPage);

// 儲存狀態的陣列
let userAnswers = new Array(data.length).fill(null);
let stageScores = new Array(totalPages).fill(null); // null表示該階段尚未訂正

// 更新下拉選單 UI
function updateSelectUI() {
    const select = document.getElementById('stage-select');
    select.innerHTML = '';
    
    for (let i = 0; i < totalPages; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        let text = `階段 ${i + 1}`;
        if (stageScores[i] !== null) {
            text += ` (答對: ${stageScores[i]})`;
        }
        opt.text = text;
        if (i === currentPage) {
            opt.selected = true;
        }
        select.appendChild(opt);
    }
}

// 更新總分 UI
function updateTotalScore() {
    let total = 0;
    stageScores.forEach(score => {
        if (score !== null) total += score;
    });
    document.getElementById('total-score-display').innerText = total;
}

// 儲存當前畫面上的答案
function saveCurrentAnswers() {
    const start = currentPage * questionsPerPage;
    const end = Math.min(start + questionsPerPage, data.length);
    for (let i = start; i < end; i++) {
        const checkedOption = document.querySelector(`input[name="q${i}"]:checked`);
        if (checkedOption) {
            userAnswers[i] = checkedOption.value;
        }
    }
}

// 跳轉指定階段
function jumpToStage(pageIndex) {
    if (stageScores[currentPage] === null) {
        saveCurrentAnswers(); // 跳轉前若還未訂正，先儲存進度
    }
    currentPage = parseInt(pageIndex);
    renderPage();
}

// 渲染當前頁面
function renderPage() {
    updateSelectUI();
    updateTotalScore();

    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    
    const start = currentPage * questionsPerPage;
    const end = Math.min(start + questionsPerPage, data.length);
    const isSubmitted = stageScores[currentPage] !== null;

    for (let i = start; i < end; i++) {
        const item = data[i];
        const div = document.createElement('div');
        div.className = 'bg-gray-50 p-4 md:p-6 rounded-lg border border-gray-200 mb-6 transition-all shadow-sm';
        div.id = `q${i}`;

        let optionsHtml = '';
        item.options.forEach(opt => {
            const isChecked = userAnswers[i] === opt.value ? 'checked' : '';
            let labelClass = 'option-label block mt-4 p-4 md:p-5 bg-white border rounded-xl flex items-center text-lg md:text-xl';
            let inputDisabled = isSubmitted ? 'disabled' : '';

            // 判斷是否已經提交訂正，決定要套用的樣式
            if (!isSubmitted) {
                labelClass += ' cursor-pointer hover:bg-blue-50 transition-colors';
            } else {
                if (opt.value === item.ans) {
                    labelClass += ' correct-ans';
                } else if (isChecked) {
                    labelClass += ' wrong-ans';
                }
            }

            optionsHtml += `
                <label class="${labelClass}">
                    <input type="radio" name="q${i}" value="${opt.value}" ${isChecked} ${inputDisabled} 
                        class="mr-4 ml-2 accent-blue-600 cursor-pointer" onchange="saveCurrentAnswers()">
                    <span class="text-gray-700 font-medium">( ${opt.value} ) ${opt.text}</span>
                </label>
            `;
        });

        div.innerHTML = `
            <div class="font-bold text-xl md:text-2xl text-gray-800 mb-5 leading-normal">
                <span class="bg-blue-600 text-white text-base md:text-lg font-bold mr-3 px-3 py-1 rounded shadow-sm">第 ${item.id} 題</span>
                ${item.q}
            </div>
            <div class="space-y-3">
                ${optionsHtml}
            </div>
        `;
        container.appendChild(div);
    }
    
    // 按鈕顯示邏輯
    if (isSubmitted) {
        document.getElementById('submit-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'block';
        if (currentPage < totalPages - 1) {
            document.getElementById('next-btn').innerText = '下一階段';
        } else {
            document.getElementById('next-btn').innerText = '測驗結束，查看總分';
        }
    } else {
        document.getElementById('submit-btn').style.display = 'block';
        document.getElementById('next-btn').style.display = 'none';
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 訂正答案
function checkAnswers() {
    saveCurrentAnswers(); // 確保最新的選擇都有儲存
    const start = currentPage * questionsPerPage;
    const end = Math.min(start + questionsPerPage, data.length);
    let correctCount = 0;

    // 計算答對題數
    for (let i = start; i < end; i++) {
        if (userAnswers[i] === data[i].ans) {
            correctCount++;
        }
    }

    // 儲存此階段分數，並重新渲染頁面以套用高光
    stageScores[currentPage] = correctCount;
    renderPage();
}

// 進入下一階段
function nextStage() {
    if (currentPage < totalPages - 1) {
        currentPage++;
        renderPage();
    } else {
        alert('恭喜您已完成所有測驗！目前總分為：' + document.getElementById('total-score-display').innerText + ' 分');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// 初始啟動
window.onload = renderPage;
</script>
